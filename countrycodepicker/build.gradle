apply plugin: 'com.android.library'

group = 'com.github.joielechong'
version = "2.4.2"
def verCode = 242

android {
    compileSdkVersion 30

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 30
        versionCode verCode
        versionName version
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'io.michaelrocks:libphonenumber-android:8.12.47'
    implementation 'androidx.annotation:annotation:1.6.0'
}