apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.shubh.shaadi"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 12
        versionName "2.1"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "ShubhShaadi@#123"
            keyAlias "release"
            keyPassword "ShubhShaadi@#123"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        //TODO Firebase Phone Auth step2 18/09/2021 Nasirali
        debug {
            splits.abi.enable = false
            splits.density.enable = false
            aaptOptions.cruncherEnabled = false
        }
    }

    //add for apk name
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def project = "MegaAdvance_"
            def date = new Date();
            def formattedDate = date.format('MMM_dd')
            def newApkName = project + formattedDate + ".apk"
            outputFileName = new File(newApkName)
        }
    }

    //06/10/2017 add for lamda support
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    //TODO Firebase Phone Auth step3 18/09/2021 Nasirali
    dexOptions {
        preDexLibraries true
        maxProcessCount 8
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
